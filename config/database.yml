default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: postgres
  host: 172.17.0.1              #Docker address
  port: 5432
  timeout: 5000

development:
  <<: *default
  database: ruby_weather_dashboard_development

test:
  <<: *default
  database: ruby_weather_dashboard_test
  
production:
  primary:
    <<: *default
    database: ruby_weather_dashboard_production
    username: postgres
    password: <%= ENV["RUBY_WEATHER_DASHBOARD_DATABASE_PASSWORD"] %>
    host: ruby-weather-dashboard-db
    port: 5432
