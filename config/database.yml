default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: postgres
  host: 127.0.0.1
  port: 5432
  timeout: 5000

development:
  <<: *default
  database: ruby_weather_dashboard_development

test:
  <<: *default
  database: ruby_weather_dashboard_test
  
production:
  primary:
    <<: *default
    database: ruby_weather_dashboard_production
    username: postgres
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: 172.17.0.1                                  #Docker ip
    port: 5432
  cable:
    <<: *default
    database: ruby_weather_dashboard_production
    username: postgres
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: 172.17.0.1
    port: 5432
    migrations_paths: db/cable_migrate
  queue:
    <<: *default
    database: ruby_weather_dashboard_production
    username: postgres
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: 172.17.0.1
    port: 5432
    migrations_paths: db/queue_migrate
