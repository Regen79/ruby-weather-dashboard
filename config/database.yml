default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  host: 127.0.0.1
  username: postgres
  password: postgres
  database: ruby_weather_dashboard_development

test:
  <<: *default
  host: 127.0.0.1
  username: postgres
  password: postgres
  database: ruby_weather_dashboard_test
  
production:
  primary: &primary_production
    <<: *default
    host: <%= ENV.fetch("DB_HOST", "ruby-weather-dashboard-db") %>
    username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    database: ruby_weather_dashboard_production
  cache:
    <<: *primary_production
    database: ruby_weather_dashboard_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: ruby_weather_dashboard_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: ruby_weather_dashboard_production_cable
    migrations_paths: db/cable_migrate