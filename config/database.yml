default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: postgres
  host: 127.0.0.1
  port: 5432
  timeout: 5000

development:
  <<: *default
  database: ruby_weather_dashboard_development

test:
  <<: *default
  database: ruby_weather_dashboard_test
  
production:
  primary:
    <<: *default
    database: ruby_weather_dashboard_production
    username: ruby_weather_dashboard
    password: <%= ENV["RUBY_WEATHER_DASHBOARD_DATABASE_PASSWORD"] %>
